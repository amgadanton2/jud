<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>مشغل الفيديو</title>
<style>
  :root{
    --bg:#0d1117;
    --panel:#151b23;
    --line:#232b36;
    --text:#e6edf3;
    --muted:#7d8590;
    --live:#3fb950;
    --off:#484f58;
    --accent:#2f81f7;
  }
  *{
    box-sizing:border-box;
    margin:0;
    padding:0;
  }
  html,body{
    margin:0;
    padding:0;
    height:100%;
    width:100%;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
    overflow:hidden;
  }
  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:10px;
  }
  .stage{
    width:100%;
    max-width:960px;
    height:100%;
    max-height:90vh;
    display:flex;
    flex-direction:column;
  }
  .status-bar{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
    font-size:13px;
    color:var(--muted);
    flex-shrink:0;
  }
  .dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--off);
    transition:background .3s ease;
    flex-shrink:0;
  }
  .dot.live{
    background:var(--live);
    box-shadow:0 0 0 3px rgba(63,185,80,.18);
  }
  .frame{
    position:relative;
    width:100%;
    flex:1;
    min-height:0;
    border-radius:10px;
    overflow:hidden;
    background:#000;
    border:1px solid var(--line);
  }
  video{
    width:100%;
    height:100%;
    display:block;
    background:#000;
    object-fit:contain; /* الافتراضي: الفيديو يظهر كامل */
  }
  /* وضعية Fill: الفيديو يملأ الإطار */
  video.fill{
    object-fit:cover;
  }
  .wait-overlay{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at center, #1a2233 0%, #05070a 100%);
    transition:opacity .5s ease;
  }
  .wait-overlay.hidden{
    opacity:0;
    pointer-events:none;
  }
  .wait-text{
    font-size:clamp(18px, 4vw, 40px);
    font-weight:600;
    color:#e6edf3;
    text-align:center;
    letter-spacing:.5px;
    padding:0 20px;
  }
  .wait-pulse{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#3fb950;
    display:inline-block;
    margin-inline-end:12px;
    animation:pulse 1.6s ease-in-out infinite;
    vertical-align:middle;
  }
  @keyframes pulse{
    0%,100%{opacity:.35; transform:scale(.85);}
    50%{opacity:1; transform:scale(1.15);}
  }
  .hint{
    margin-top:10px;
    font-size:12px;
    color:var(--muted);
    line-height:1.7;
    flex-shrink:0;
    text-align:center;
  }
  .error-msg{
    color:#f85149;
    font-size:13px;
    margin-top:8px;
    padding:8px 12px;
    background:rgba(248,81,73,0.1);
    border-radius:8px;
    border:1px solid rgba(248,81,73,0.2);
    display:none;
    flex-shrink:0;
  }
  .error-msg.show{
    display:block;
  }

  /* أزرار التحكم في الفيديو */
  .video-controls{
    display:flex;
    gap:10px;
    margin-top:10px;
    justify-content:center;
    flex-shrink:0;
    flex-wrap:wrap;
  }
  .video-controls button{
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    padding:10px 20px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
    transition:background .2s;
    flex:1;
    min-width:80px;
    max-width:150px;
  }
  .video-controls button:hover{
    background:var(--line);
  }
  .video-controls button.fullscreen{
    background:var(--accent);
    border-color:var(--accent);
  }
  .video-controls button.fullscreen:hover{
    background:#4a90fa;
  }
  .video-controls button.fit{
    background:#238636;
    border-color:#238636;
  }
  .video-controls button.fit:hover{
    background:#2ea043;
  }
  .video-controls button.fit.active{
    background:#1f6feb;
    border-color:#1f6feb;
  }

  /* للشاشات الصغيرة (موبايل) */
  @media (max-width: 600px) {
    body{
      padding:8px;
    }
    .video-controls button{
      padding:12px 16px;
      font-size:13px;
      min-width:60px;
    }
    .status-bar{
      font-size:12px;
    }
    .hint{
      font-size:11px;
    }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="status-bar">
    <span class="dot" id="connDot"></span>
    <span id="connText">بيتصل بالسيرفر...</span>
  </div>

  <div class="frame" id="videoFrame">
    <video id="video" playsinline webkit-playsinline crossorigin="anonymous">
      <source src="video.mp4" type="video/mp4">
    </video>
    <div class="wait-overlay" id="waitOverlay">
      <div class="wait-text"><span class="wait-pulse"></span>في انتظار فريق البابا كيرلس</div>
    </div>
  </div>

  <!-- أزرار التحكم في الفيديو -->
  <div class="video-controls">
    <button class="fit" id="btnFit">⬜ Fit</button>
    <button class="fullscreen" id="btnFullscreen">⛶ تكبير</button>
  </div>

  <div class="error-msg" id="errorMsg">⚠️ <span id="errorText"></span></div>

  <div class="hint">
    الفيديو بيتم تشغيله الآن ومربوط بنظام التزامن عبر Firebase.
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, onValue, onDisconnect, set, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCvq57e4E09X4jttg7jAG4iBAFqPUv4wOY",
    authDomain: "judas-b2914.firebaseapp.com",
    databaseURL: "https://judas-b2914-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "judas-b2914",
    storageBucket: "judas-b2914.firebasestorage.app",
    messagingSenderId: "811595442651",
    appId: "1:811595442651:web:e647211c2db0eff3d01ffe",
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const video = document.getElementById("video");
  const dot = document.getElementById("connDot");
  const connText = document.getElementById("connText");
  const waitOverlay = document.getElementById("waitOverlay");
  const errorMsg = document.getElementById("errorMsg");
  const errorText = document.getElementById("errorText");
  const videoFrame = document.getElementById("videoFrame");

  const DRIFT_TOLERANCE = 0.3;
  let isFitMode = true; // Fit هو الوضع الافتراضي

  function showError(msg) {
    errorText.textContent = msg;
    errorMsg.classList.add("show");
    setTimeout(() => errorMsg.classList.remove("show"), 8000);
  }

  // --- زر Fit: تبديل بين وضعية Fit و Fill ---
  document.getElementById("btnFit").addEventListener("click", () => {
    isFitMode = !isFitMode;
    const btn = document.getElementById("btnFit");
    if (isFitMode) {
      video.classList.remove("fill");
      btn.textContent = "⬜ Fit";
      btn.classList.remove("active");
    } else {
      video.classList.add("fill");
      btn.textContent = "⬜ Fill";
      btn.classList.add("active");
    }
  });

  // --- زر التكبير (شاشة كاملة) ---
  document.getElementById("btnFullscreen").addEventListener("click", () => {
    if (!document.fullscreenElement) {
      videoFrame.requestFullscreen().catch(err => {
        showError("لا يمكن الدخول إلى وضع ملء الشاشة: " + err.message);
      });
    } else {
      document.exitFullscreen();
    }
  });

  document.addEventListener("fullscreenchange", () => {
    const btn = document.getElementById("btnFullscreen");
    if (document.fullscreenElement) {
      btn.textContent = "⛶ تصغير";
    } else {
      btn.textContent = "⛶ تكبير";
    }
  });

  // --- حالة الاتصال ---
  onValue(ref(db, ".info/connected"), (snap) => {
    const connected = snap.val() === true;
    dot.classList.toggle("live", connected);
    connText.textContent = connected ? "متصل ومباشر (live)" : "مفيش اتصال بالسيرفر";
    console.log("🔥 الاتصال:", connected ? "متصل ✅" : "مفصول ❌");
    if (!connected) showError("لا يوجد اتصال بالسيرفر، تأكد من اتصال الإنترنت");
  });

  const presenceRef = ref(db, "player/presence");
  set(presenceRef, { online: true, since: serverTimestamp() });
  onDisconnect(presenceRef).set({ online: false, since: serverTimestamp() });

  function showWaiting(show) {
    waitOverlay.classList.toggle("hidden", !show);
  }

  let lastCmdTs = null;

  onValue(ref(db, "control"), (snap) => {
    const data = snap.val();
    console.log("📡 أمر واصل:", data);
    if (!data || data.ts === lastCmdTs) return;
    lastCmdTs = data.ts;

    switch (data.action) {
      case "play":
        console.log("▶ تشغيل");
        showWaiting(false);
        video.play().catch((err) => {
          console.error("❌ خطأ في التشغيل:", err);
          showError("خطأ في تشغيل الفيديو: " + err.message);
        });
        break;
      case "pause":
        console.log("⏸ إيقاف مؤقت");
        video.pause();
        break;
      case "restart":
        console.log("⟲ إعادة تشغيل");
        showWaiting(false);
        video.currentTime = 0;
        video.play().catch((err) => {
          console.error("❌ خطأ في إعادة التشغيل:", err);
          showError("خطأ في إعادة التشغيل: " + err.message);
        });
        break;
      case "seek":
        console.log("⏩ ذهاب إلى:", data.time);
        if (typeof data.time === "number") {
          video.currentTime = data.time;
        }
        break;
      case "stop":
        console.log("⏹ إيقاف كامل");
        video.pause();
        video.currentTime = 0;
        showWaiting(true);
        break;
    }
  });

  onValue(ref(db, "sync"), (snap) => {
    const s = snap.val();
    if (!s || typeof s.time !== "number") return;

    const drift = Math.abs(video.currentTime - s.time);
    if (drift > DRIFT_TOLERANCE) {
      video.currentTime = s.time;
    }
    if (s.playing && video.paused) {
      showWaiting(false);
      video.play().catch((err) => {
        console.error("❌ خطأ في المزامنة:", err);
      });
    }
    if (!s.playing && !video.paused) {
      video.pause();
    }
  });

  const playerStateRef = ref(db, "player/state");
  function reportState(playing) {
    set(playerStateRef, { 
      playing, 
      currentTime: video.currentTime, 
      updatedAt: serverTimestamp() 
    });
  }

  video.addEventListener("play", () => {
    reportState(true);
    console.log("▶ الفيديو بدأ");
  });
  
  video.addEventListener("pause", () => {
    reportState(false);
    console.log("⏸ الفيديو توقف");
  });

  video.addEventListener("error", (e) => {
    console.error("❌ خطأ في الفيديو:", e);
    showError("خطأ في تحميل الفيديو. تأكد من وجود ملف video.mp4 في نفس المجلد");
  });

  video.addEventListener("loadedmetadata", () => {
    console.log("✅ تم تحميل بيانات الفيديو، المدة:", video.duration, "ثانية");
  });

  setInterval(() => { 
    if (!video.paused) reportState(true); 
  }, 1000);

  console.log("🚀 مشغل الفيديو جاهز!");
</script>

</body>
</html>
